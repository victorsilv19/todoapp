---
- name: Install Nginx and Certbot
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/todoapp
    - /etc/todoapp

- name: Create frontend and backend source directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/todoapp/frontend
    - /opt/todoapp/backend

- name: Copy frontend source files to the application VM
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../frontend/{{ item.src }}"
    dest: "/opt/todoapp/frontend/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: "Dockerfile", dest: "Dockerfile" }
    - { src: "package.json", dest: "package.json" }
    - { src: "package-lock.json", dest: "package-lock.json" }

- name: Copy frontend assets without local build artifacts
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../frontend/{{ item }}/"
    dest: "/opt/todoapp/frontend/{{ item }}/"
    owner: root
    group: root
    mode: preserve
  loop:
    - public
    - src

- name: Copy backend source files to the application VM
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../backend/{{ item }}"
    dest: "/opt/todoapp/backend/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - Dockerfile
    - index.js
    - package.json
    - package-lock.json

- name: Copy the production Compose definition
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../docker-compose.app.yml"
    dest: /opt/todoapp/docker-compose.app.yml
    owner: root
    group: root
    mode: "0644"

- name: Install the protected application environment file
  ansible.builtin.template:
    src: app.env.j2
    dest: /opt/todoapp/.env
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Build and start the versioned application containers
  block:
    - name: Start the application containers
      community.docker.docker_compose_v2:
        project_src: /opt/todoapp
        files:
          - docker-compose.app.yml
        state: present
        build: policy
        pull: never
        recreate: auto
        remove_orphans: true
        wait: true
        wait_timeout: 180
      register: application_compose
  rescue:
    - name: Capture backend logs after a failed startup
      ansible.builtin.command:
        argv:
          - docker
          - logs
          - --tail
          - "80"
          - todo-backend
      register: application_backend_logs
      changed_when: false
      failed_when: false

    - name: Display backend logs after a failed startup
      ansible.builtin.debug:
        var: application_backend_logs.stdout_lines

    - name: Display backend error logs after a failed startup
      ansible.builtin.debug:
        var: application_backend_logs.stderr_lines

    - name: Fail deployment after collecting backend logs
      ansible.builtin.fail:
        msg: "Application containers did not become ready; inspect the backend logs above."

- name: Create the Let's Encrypt HTTP-01 challenge webroot
  ansible.builtin.file:
    path: /var/www/certbot/.well-known/acme-challenge
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check whether the certificate exists for the current hostname
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ app_domain_name }}/fullchain.pem"
  register: letsencrypt_certificate

- name: Configure temporary HTTP access for certificate issuance
  ansible.builtin.template:
    src: todoapp-nginx-acme.conf.j2
    dest: /etc/nginx/sites-available/todoapp-acme
    owner: root
    group: root
    mode: "0644"
  notify: Reload Nginx
  when: not letsencrypt_certificate.stat.exists

- name: Enable the temporary ACME challenge site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/todoapp-acme
    dest: /etc/nginx/sites-enabled/todoapp
    state: link
    force: true
  notify: Reload Nginx
  when: not letsencrypt_certificate.stat.exists

- name: Disable the default Nginx site before certificate issuance
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload Nginx

- name: Start Nginx to serve the HTTP-01 challenge
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Apply the temporary Nginx configuration
  ansible.builtin.meta: flush_handlers

- name: Obtain the trusted HTTPS certificate
  ansible.builtin.command:
    argv:
      - certbot
      - certonly
      - --non-interactive
      - --agree-tos
      - --register-unsafely-without-email
      - --webroot
      - --webroot-path
      - /var/www/certbot
      - --domain
      - "{{ app_domain_name }}"
    creates: "/etc/letsencrypt/live/{{ app_domain_name }}/fullchain.pem"
  when: not letsencrypt_certificate.stat.exists

- name: Configure the Nginx reverse proxy
  ansible.builtin.template:
    src: todoapp-nginx.conf.j2
    dest: /etc/nginx/sites-available/todoapp
    owner: root
    group: root
    mode: "0644"
  notify: Reload Nginx

- name: Enable the ToDo App Nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/todoapp
    dest: /etc/nginx/sites-enabled/todoapp
    state: link
    force: true
  notify: Reload Nginx

- name: Ensure the Certbot deploy-hook directory exists
  ansible.builtin.file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the certificate renewal Nginx reload hook
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx
    content: |
      #!/bin/sh
      systemctl reload nginx
    owner: root
    group: root
    mode: "0750"

- name: Enable automatic certificate renewal
  ansible.builtin.systemd:
    name: certbot.timer
    state: started
    enabled: true
    daemon_reload: true

- name: Renew certificates that are due for renewal
  ansible.builtin.command:
    argv:
      - certbot
      - renew
      - --quiet
  changed_when: false

- name: Remove the obsolete self-signed certificate and marker
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/todoapp/tls-ip
    - /etc/ssl/private/todoapp-selfsigned.key
    - /etc/ssl/certs/todoapp-selfsigned.crt

- name: Enable and start Nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Apply pending service restarts
  ansible.builtin.meta: flush_handlers

- name: Verify the API through the private host binding
  ansible.builtin.uri:
    url: http://127.0.0.1:5000/todos
    status_code: 200
  register: api_health
  retries: 12
  delay: 5
  until: api_health.status == 200

- name: Verify the public HTTPS reverse proxy
  ansible.builtin.command:
    argv:
      - curl
      - --fail
      - --silent
      - --show-error
      - --connect-timeout
      - "5"
      - --max-time
      - "20"
      - --output
      - /dev/null
      - --write-out
      - "%{http_code}"
      - --resolve
      - "{{ app_domain_name }}:443:127.0.0.1"
      - "https://{{ app_domain_name }}/todos"
  register: public_https_health
  changed_when: false
  failed_when: public_https_health.stdout != "200"
