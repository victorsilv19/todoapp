version: '3.8'

services:
  frontend:
    build:
      context: ./frontend  # Diretório do frontend
    ports:
      - "80:80"  # Expõe a porta 80 do contêiner para a porta 80 do host
    networks:
      - todo-net
    depends_on:
      - backend  # Garante que o backend esteja rodando antes de subir o frontend

  backend:
    build:
      context: ./backend  # Diretório do backend
    ports:
      - "5000:5000"  # Expõe a porta 5000 do contêiner para a porta 5000 do host
    networks:
      - todo-net
    depends_on:
      - mongo  # Garante que o MongoDB esteja rodando antes de iniciar o backend
    environment:
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in the ignored .env file}

  mongo:
    build:
      context: ./banco-de-dados  # Diretório do backend
    container_name: mongo-todo
    networks:
      - todo-net
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in the ignored .env file}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in the ignored .env file}
      MONGO_INITDB_DATABASE: todo-app
    volumes:
      - mongo-data:/data/db


networks:
  todo-net:
    driver: bridge

volumes:
  mongo-data:
