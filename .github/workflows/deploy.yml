name: Deploy ToDo App on GCP

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        options:
          - dev
          - homolog
          - prod
        default: dev
        required: true
      instance_name:
        description: Base name for the GCP instances and persistent disks
        type: string
        default: vm-todo-pm04
        required: true
      instance_type:
        description: Compute Engine machine type used by both VMs
        type: choice
        options:
          - e2-small
          - e2-medium
          - e2-standard-2
        default: e2-medium
        required: true
      source_ref:
        description: Git branch, tag, or commit to deploy; empty uses the selected workflow ref
        type: string
        default: ""
        required: false
      docker_image:
        description: Local image name prefix for the frontend and API
        type: string
        default: todo-app
        required: true
      docker_tag:
        description: Immutable release tag applied to both application images
        type: string
        default: "1.0.0"
        required: true
      update_os:
        description: Apply operating system upgrades
        type: boolean
        default: false
        required: true
      extra_packages:
        description: Comma-separated packages to install on both VMs
        type: string
        default: curl,git,unzip
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: pm04-infrastructure
  cancel-in-progress: false

jobs:
  deploy:
    name: Provision and configure ${{ inputs.environment }}
    runs-on: ubuntu-latest
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_zone: ${{ vars.GCP_ZONE }}
      TF_WORKSPACE: pm04-todoapp-${{ inputs.environment }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Checkout deployment source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate frontend build and backend syntax
        run: |
          set -euo pipefail
          npm ci
          npm run build
          cd ../backend
          node --check index.js
        working-directory: frontend

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Cache Ansible dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.ansible/collections
          key: ansible-${{ runner.os }}-${{ hashFiles('ansible/requirements.yml') }}-2.18.6

      - name: Set up Ansible
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible-venv"
          "$RUNNER_TEMP/ansible-venv/bin/pip" install --disable-pip-version-check ansible-core==2.18.6
          "$RUNNER_TEMP/ansible-venv/bin/ansible-galaxy" collection install -r ansible/requirements.yml
          echo "$RUNNER_TEMP/ansible-venv/bin" >> "$GITHUB_PATH"

      - name: Check Ansible playbook syntax
        run: |
          cat > "$RUNNER_TEMP/ansible-check.ini" <<'EOF'
          [app]
          app ansible_host=127.0.0.1
          [db]
          db ansible_host=127.0.0.1
          EOF
          ansible-playbook -i "$RUNNER_TEMP/ansible-check.ini" ansible/playbook.yml --syntax-check

      - name: Validate deployment secrets and configuration
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          MONGODB_ROOT_PASSWORD: ${{ secrets.MONGODB_ROOT_PASSWORD }}
          MONGODB_APP_PASSWORD: ${{ secrets.MONGODB_APP_PASSWORD }}
        run: |
          set -euo pipefail
          for name in GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT GCP_PROJECT_ID GCP_REGION GCP_ZONE SSH_PRIVATE_KEY TF_API_TOKEN MONGODB_ROOT_PASSWORD MONGODB_APP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required."
              exit 1
            fi
          done
          python3 - <<'PY'
          import os

          project_id = os.environ["GCP_PROJECT_ID"]
          expected_service_account = f"pm04-github-actions@{project_id}.iam.gserviceaccount.com"
          if os.environ["GCP_SERVICE_ACCOUNT"] != expected_service_account:
              raise SystemExit("GCP_SERVICE_ACCOUNT must be pm04-github-actions in GCP_PROJECT_ID.")
          provider = os.environ["GCP_WORKLOAD_IDENTITY_PROVIDER"]
          expected_provider_suffix = "/locations/global/workloadIdentityPools/github-actions/providers/github"
          if not provider.startswith("projects/") or not provider.endswith(expected_provider_suffix):
              raise SystemExit("GCP_WORKLOAD_IDENTITY_PROVIDER must identify the github-actions/github provider.")
          if not os.environ["GCP_ZONE"].startswith(os.environ["GCP_REGION"] + "-"):
              raise SystemExit("GCP_ZONE must belong to GCP_REGION.")
          PY

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure SSH key for the runner
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          KEY_FILE="$RUNNER_TEMP/pm04-deploy-key"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          eval "$(ssh-agent -s)"
          ssh-add "$KEY_FILE"
          SSH_PUBLIC_KEY="$(ssh-keygen -y -f "$KEY_FILE")"
          echo "TF_VAR_ssh_public_key=$SSH_PUBLIC_KEY" >> "$GITHUB_ENV"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Determine the runner SSH source address
        id: runner-ip
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl --fail --silent --show-error --ipv4 https://api.ipify.org)"
          echo "$RUNNER_IP" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$' || {
            echo "::error::Could not determine a valid runner IPv4 address."
            exit 1
          }
          echo "address=$RUNNER_IP" >> "$GITHUB_OUTPUT"

      - name: Terraform init, validate, and plan
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          INSTANCE_NAME: ${{ inputs.instance_name }}
          INSTANCE_TYPE: ${{ inputs.instance_type }}
          DOCKER_IMAGE: ${{ inputs.docker_image }}
          DOCKER_TAG: ${{ inputs.docker_tag }}
          RUNNER_IP: ${{ steps.runner-ip.outputs.address }}
        run: |
          set -euo pipefail
          cd terraform
          echo "::group::terraform init"
          terraform init -input=false
          echo "::endgroup::"
          echo "::group::terraform validate"
          terraform validate
          echo "::endgroup::"
          echo "::group::terraform plan"
          terraform plan -input=false -out="$RUNNER_TEMP/pm04.tfplan" \
            -var="environment=$ENVIRONMENT" \
            -var="instance_name=$INSTANCE_NAME" \
            -var="instance_type=$INSTANCE_TYPE" \
            -var="ssh_allowed_cidrs=[\"${RUNNER_IP}/32\"]" \
            -var="docker_image=$DOCKER_IMAGE" \
            -var="docker_tag=$DOCKER_TAG"
          echo "::endgroup::"

      - name: Apply Terraform plan
        run: |
          set -euo pipefail
          cd terraform
          terraform apply -input=false -auto-approve "$RUNNER_TEMP/pm04.tfplan"

      - name: Wait for both VMs to become accessible over SSH
        run: |
          set -euo pipefail
          cd terraform
          APP_IP="$(terraform output -raw app_public_ipv4_address)"
          DB_IP="$(terraform output -raw db_private_ipv4_address)"
          echo "Waiting for SSH at the app VM ($APP_IP)"
          for attempt in $(seq 1 36); do
            if ssh -o BatchMode=yes -o ConnectTimeout=5 \
              -o StrictHostKeyChecking=no ubuntu@"$APP_IP" true; then
              break
            fi
            if [ "$attempt" -eq 36 ]; then
              echo "::error::App VM did not become reachable over SSH."
              exit 1
            fi
            sleep 10
          done
          echo "Waiting for SSH to the DB VM through the app VM ($DB_IP)"
          for attempt in $(seq 1 36); do
            if ssh -o BatchMode=yes -o ConnectTimeout=5 \
              -o StrictHostKeyChecking=no -J "ubuntu@$APP_IP" ubuntu@"$DB_IP" true; then
              echo "Both VMs are reachable over SSH."
              exit 0
            fi
            if [ "$attempt" -eq 36 ]; then
              echo "::error::DB VM did not become reachable over SSH through the app VM."
              exit 1
            fi
            sleep 10
          done

      - name: Configure database and deploy application with Ansible
        env:
          DOCKER_IMAGE: ${{ inputs.docker_image }}
          DOCKER_TAG: ${{ inputs.docker_tag }}
          UPDATE_OS: ${{ inputs.update_os }}
          EXTRA_PACKAGES: ${{ inputs.extra_packages }}
          INSTANCE_NAME: ${{ inputs.instance_name }}
          MONGODB_ROOT_PASSWORD: ${{ secrets.MONGODB_ROOT_PASSWORD }}
          MONGODB_APP_PASSWORD: ${{ secrets.MONGODB_APP_PASSWORD }}
        run: |
          set -euo pipefail
          cd terraform
          MONGO_VOLUME_NAME="$(terraform output -raw mongo_volume_name)"
          MONGO_BACKUP_VOLUME_NAME="$(terraform output -raw mongo_backup_volume_name)"
          cd ..
          export MONGO_VOLUME_NAME MONGO_BACKUP_VOLUME_NAME
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          values = {
              "instance_name": os.environ["INSTANCE_NAME"],
              "docker_image": os.environ["DOCKER_IMAGE"],
              "docker_tag": os.environ["DOCKER_TAG"],
              "update_os": os.environ["UPDATE_OS"].lower() == "true",
              "extra_packages": os.environ["EXTRA_PACKAGES"],
              "mongo_volume_name": os.environ["MONGO_VOLUME_NAME"],
              "mongo_backup_volume_name": os.environ["MONGO_BACKUP_VOLUME_NAME"],
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "ansible-extra-vars.json"
          path.write_text(json.dumps(values), encoding="utf-8")
          path.chmod(0o600)
          PY
          ansible -i ansible/inventory/hosts.ini db-vm -m ping -vvvv
          ansible-playbook -i ansible/inventory/hosts.ini ansible/playbook.yml \
            --extra-vars "@$RUNNER_TEMP/ansible-extra-vars.json"

      - name: Display deployment URL
        run: |
          APP_IP="$(terraform -chdir=terraform output -raw app_public_ipv4_address)"
          echo "ToDo App is available at https://$APP_IP"
          echo "The certificate is self-signed; browsers will display a trust warning."
